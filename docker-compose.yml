# Production stack for one VPS: Postgres + Redis + Django API + Celery worker + Caddy.
# Secrets and hostnames come from .env next to this file (see deploy/env.example).
# Deploy with deploy/deploy.sh; first-time server setup is in deploy/README.md.

name: axespareparts

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-backend: &backend
  build: ./backend
  image: axespareparts-api
  restart: unless-stopped
  env_file: .env
  environment:
    DEBUG: "false"
    DATABASE_URL: postgresql://axe:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/axespareparts
    REDIS_URL: redis://redis:6379/0
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_started }
  logging: *logging

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: axe
      POSTGRES_DB: axespareparts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: postgres -c shared_buffers=${PG_SHARED_BUFFERS:-128MB} -c effective_cache_size=512MB -c max_connections=50
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axe -d axespareparts"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 768m
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --maxmemory 64mb --maxmemory-policy noeviction
    volumes: [redisdata:/data]
    mem_limit: 128m
    logging: *logging

  api:
    <<: *backend
    # Each worker uses ~600 MB while removing photo backgrounds. 1 worker for a 2 GB server, 2 for 4 GB+.
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-1} --threads 4 --timeout 120
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/healthz', headers={'X-Forwarded-Proto': 'https', 'Host': 'localhost'}), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    <<: *backend
    build: !reset null   # same image as api, built once by the api service
    pull_policy: never
    command: celery -A config worker -l info --concurrency 1
    mem_limit: 384m

  caddy:
    build:
      context: .
      dockerfile: deploy/Caddy.Dockerfile
    image: axespareparts-web
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    logging: *logging

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
