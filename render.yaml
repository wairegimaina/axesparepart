# Render Blueprint: PostgreSQL + Django API + React static site.
# The static site rewrites /api/* to the API, so the browser sees ONE origin
# and Django's session cookie + CSRF work without cross-site cookie settings.
#
# If Render gives the API a different hostname than axespareparts-api.onrender.com,
# update the three rewrite destinations below and FRONTEND_URL / CSRF_TRUSTED_ORIGINS.

# Database: Supabase Postgres (set DATABASE_URL in the dashboard), not a Render database.

services:
  - type: web
    name: axespareparts-api
    runtime: python
    region: frankfurt   # closest to Supabase eu-west-1
    rootDir: backend
    # Standard (2 GB): product photo background removal needs ~600 MB per worker that handles uploads.
    plan: standard
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py download_background_model
    preDeployCommand: python manage.py migrate --noinput && python manage.py seed
    startCommand: gunicorn config.wsgi:application --workers 2 --threads 4 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      # Supabase *session* pooler (port 5432), e.g.
      # postgresql://postgres.<ref>:<password>@aws-1-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: axespareparts-api.onrender.com
      - key: FRONTEND_URL
        value: https://axespareparts.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://axespareparts.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://axespareparts.onrender.com
      - key: CLOUDINARY_URL
        sync: false   # paste cloudinary://<key>:<secret>@<cloud> in the dashboard
      - key: CLOUDINARY_FOLDER
        value: axespareparts
      # Brevo SMTP for transactional email. Until set, emails print to the logs.
      - key: EMAIL_BACKEND
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Optional: add a Render Key Value (Redis) instance and a Celery worker,
      # then set REDIS_URL here and on the worker. Without it, tasks run inline.
      # - key: REDIS_URL
      #   fromService: { type: keyvalue, name: axespareparts-redis, property: connectionString }

  - type: web
    name: axespareparts
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /api/*
        destination: https://axespareparts-api.onrender.com/api/*
      - type: rewrite
        source: /django-admin/*
        destination: https://axespareparts-api.onrender.com/django-admin/*
      - type: rewrite
        source: /static/*
        destination: https://axespareparts-api.onrender.com/static/*
      - type: rewrite
        source: /*
        destination: /index.html

